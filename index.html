<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บะหมี่กึ่งสำเร็จรูป</title>
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --ink: #2b1d12;
    --muted: #7a6a5a;
    --accent: #d9480f;
    --line: #f0e2cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", "Noto Sans Thai", "Tahoma", sans-serif;
    line-height: 1.5;
  }
  header { text-align: center; padding: 48px 16px 24px; }
  header h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 40px); }
  header p { margin: 0; color: var(--muted); }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(120, 70, 20, .08);
  }
  .photo {
    aspect-ratio: 4 / 3;
    background: #fdebd0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 16px 18px 20px; }
  .sku { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .name { margin: 4px 0 12px; font-size: 20px; font-weight: 700; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .price { font-size: 28px; font-weight: 800; color: var(--accent); }
  .price small { font-size: 14px; font-weight: 600; }
  .weight { color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 16px; }
</style>
</head>
<body>
<header>
  <h1>บะหมี่กึ่งสำเร็จรูป</h1>
  <p>รายการสินค้า</p>
</header>

<main id="products"></main>

<footer>ราคาเป็นสกุลเงินบาท</footer>

<script>
  // แก้ไขข้อมูลสินค้าได้ที่นี่ แล้วหน้าเว็บจะอัปเดตเอง
  // ถ้าจะใช้รูปถ่ายจริง ให้อัปโหลดไว้ในโฟลเดอร์ images แล้วเปลี่ยนชื่อไฟล์ตรงนี้
  const products = [
    { sku: "NOODLE-01", name: "บะหมี่รสหมูสับ",   price: 12, weight: "60 กรัม", images: ["images/sku01.jpg", "images/sku01.png", "images/sku01.svg"] },
    { sku: "NOODLE-02", name: "บะหมี่รสไข่เค็ม", price: 15, weight: "65 กรัม", images: ["images/sku02.jpg", "images/sku02.png", "images/sku02.svg"] }
  ];

  const root = document.getElementById("products");

  products.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";

    const photo = document.createElement("div");
    photo.className = "photo";
    const img = document.createElement("img");
    img.alt = p.name;
    let i = 0;
    img.onerror = () => {
      i++;
      if (i < p.images.length) { img.src = p.images[i]; }
      else { photo.textContent = "ไม่พบรูปภาพ"; }
    };
    img.src = p.images[0];
    photo.appendChild(img);

    const body = document.createElement("div");
    body.className = "body";

    const sku = document.createElement("div");
    sku.className = "sku";
    sku.textContent = p.sku;

    const name = document.createElement("h2");
    name.className = "name";
    name.textContent = p.name;

    const row = document.createElement("div");
    row.className = "row";

    const price = document.createElement("div");
    price.className = "price";
    price.append(String(p.price) + " ");
    const unit = document.createElement("small");
    unit.textContent = "บาท";
    price.appendChild(unit);

    const weight = document.createElement("div");
    weight.className = "weight";
    weight.textContent = p.weight;

    row.append(price, weight);
    body.append(sku, name, row);
    card.append(photo, body);
    root.appendChild(card);
  });
</script>
</body>
</html>
